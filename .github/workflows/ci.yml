name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check here before it publishes.
  workflow_call:

concurrency:
  # When release.yml calls this workflow, github.workflow is "Release", so the group differs from a push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Changelog
        run: npm run check:changelog

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # docs/patterns, docs/exports.json and docs/components.md must match Storybook and AGENTS.md.
      - name: Package docs
        run: npm run check:docs

      - name: Case collisions
        run: npm run validate:case

      - name: Composition audit
        run: npm run validate:composition

      - name: Unit tests
        run: npm run test:unit

      # Builds dist and checks it against src/package.manifest.ts.
      - name: Package build and manifest
        run: npm run build

      # What `npm publish` would upload: required files present, sources and tests absent.
      - name: Package contents
        run: npm run check:pack

      # No registry credentials here; npm checks the package and stops before uploading.
      - name: Publish dry run
        run: npm publish --dry-run --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Storybook interaction tests
        run: npm run test:interactions

  # Every Pattern's Show code, pasted unchanged into a Next 16 / React 19 / strict TypeScript app with
  # eslint-config-next (the create-next-app 16 setup), must pass tsc and eslint with zero warnings.
  show-code:
    name: Show code in a Next app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Runs `prepare`, which builds dist.
      - name: Install
        run: npm ci

      - name: Show code in fixtures/next-consumer
        run: npm run check:show-code
