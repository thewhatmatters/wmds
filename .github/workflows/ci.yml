name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Case collisions
        run: npm run validate:case

      - name: Composition audit
        run: npm run validate:composition

      - name: Unit tests
        run: npm run test:unit

      # Builds dist and checks it against src/package.manifest.ts.
      - name: Package build and manifest
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Storybook interaction tests
        run: npm run test:interactions
